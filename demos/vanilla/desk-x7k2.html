<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>editable-website · HTML demo · hidden login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="login" data-demo="login-card">
      <p class="kicker">Hidden login</p>
      <p class="lede">/desk-x7k2</p>
      <h1>Access hidden login</h1>
      <p class="lede">This URL is not linked from the home page. Any valid email and password works. No real session.</p>
      <form id="hidden-login" data-demo="hidden-login-form">
        <label>
          Email
          <input id="email" type="email" required autocomplete="username" />
        </label>
        <label>
          Password
          <input id="pass" type="password" required autocomplete="current-password" />
        </label>
        <p id="err" class="err" hidden></p>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <p><a href="/">← Back</a></p>
      <footer class="editor-footer">
        <a class="editor-footer-repo" href="https://github.com/adamsiwiec1/editable-website" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8" />
          </svg>
          GitHub
        </a>
        <a href="https://github.com/adamsiwiec1" target="_blank" rel="noreferrer" title="@adamsiwiec1">
          <img class="editor-footer-avatar" src="https://github.com/adamsiwiec1.png" alt="@adamsiwiec1" width="44" height="44" />
        </a>
      </footer>
    </main>
    <script>
      const KEY = 'editable-demo:owner';
      document.getElementById('hidden-login').addEventListener('submit', (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value.trim();
        const err = document.getElementById('err');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !pass) {
          err.hidden = false;
          err.textContent = 'Enter a valid email and a password.';
          return;
        }
        sessionStorage.setItem(KEY, '1');
        sessionStorage.setItem('ew-walk:active', '1');
        sessionStorage.setItem('ew-walk:step', 'edit-chip');
        location.href = '/';
      });
    </script>
    <script type="module">
      import { bootWalkthrough } from '/ew-walk.js';
      bootWalkthrough({
        isAdmin: () => sessionStorage.getItem('editable-demo:owner') === '1',
        setEditing: () => {},
      });
    </script>
  </body>
</html>
